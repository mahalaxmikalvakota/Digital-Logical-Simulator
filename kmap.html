<!DOCTYPE html>
<html>

<head>
    <title>K-Map Solver</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="simulator.html">Simulator</a>
        <a href="learn.html">Learn</a>
        <a href="kmap.html">K-Map</a>
        <a href="about.html">About</a>
    </div>

    <div class="container">

        <h1>🧠 K-Map Solver</h1>

        <div class="card">
            <h2>Enter Values</h2>
            <input id="k0" type="number" min="0" max="1" placeholder="00">
            <input id="k1" type="number" min="0" max="1" placeholder="01">
            <input id="k2" type="number" min="0" max="1" placeholder="10">
            <input id="k3" type="number" min="0" max="1" placeholder="11">


            <br><br>

            <button onclick="solveKMap()">Solve</button>
        </div>

        <div class="card">
            <h2>Result</h2>
            <p id="kresult">---</p>
        </div>

    </div>

    <script>

        function solveKMap() {

            let v0 = parseInt(document.getElementById("k0").value) || 0;
            let v1 = parseInt(document.getElementById("k1").value) || 0;
            let v2 = parseInt(document.getElementById("k2").value) || 0;
            let v3 = parseInt(document.getElementById("k3").value) || 0;

            let result = "";

            if (v0 === 1 && v1 === 1 && v2 === 1 && v3 === 1)
                result = "1";

            else if (v3 === 1 && v0 === 0 && v1 === 0 && v2 === 0)
                result = "AB";

            else if (v1 === 1 && v2 === 1 && v3 === 1)
                result = "A + B";

            else if (v0 === 1 && v1 === 1 && v2 === 1 && v3 === 0)
                result = "(AB)'";

            else if (v0 === 1 && v1 === 0 && v2 === 0 && v3 === 0)
                result = "(A+B)'";

            else if (v1 === 1 && v2 === 1 && v0 === 0 && v3 === 0)
                result = "A ⊕ B";

            else if (v0 === 1 && v3 === 1 && v1 === 0 && v2 === 0)
                result = "A ⊙ B";

            else
                result = "Complex / No match";

            document.getElementById("kresult").innerText = result;
        }



    </script>

</body>

</html>
